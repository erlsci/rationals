name: ci

on:
  push:
    branches: [main, 'release/**', 'task/**', 'feature/**', 'epic/**']
    tags: ['**']
  pull_request:
    branches: [main, 'release/**', 'task/**', 'feature/**', 'epic/**']

# CI calls the same `make` targets a developer runs locally, so `make check`
# and CI exercise identical commands — no "passes locally, fails in CI" surprises.
# The matrix jobs run the build/test gate across the OTP support range; a single
# `lint` job runs the dev-profile style tools (which need a modern OTP).

jobs:

  older-builds:
    name: Erlang ${{ matrix.otp_version }} build (Debian container)
    runs-on: ubuntu-latest
    # GitHub retired the ubuntu-20.04 hosted runner (2025-04-15) and old OTP has
    # no precompiled builds for current runners, so the old tier runs inside the
    # official Debian-based erlang images (OTP baked in) rather than via setup-beam.
    # These images are buildpack-deps-based, so `make` is already present.
    container:
      image: erlang:${{ matrix.otp_version }}

    strategy:
      fail-fast: false
      matrix:
        otp_version: [20, 21, 22, 23]

    steps:
    # actions/checkout runs on Node (v6 → Node 24), which won't start on these
    # old Debian images' glibc, so check out manually with the container's git.
    # Public repo: no token needed; GitHub permits fetching by commit SHA.
    - name: Checkout (container-safe, no Node action)
      run: |
        git config --global --add safe.directory '*'
        git init -q .
        git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
        git fetch -q --depth 1 origin "${GITHUB_SHA}"
        git checkout -q FETCH_HEAD
    - name: Install rebar3 3.15
      # 3.15 is the last rebar3 line that supports these OTP releases; the image's
      # bundled rebar3 may be too new, so pin it explicitly.
      run: |
        wget -O /usr/local/bin/rebar3 https://github.com/erlang/rebar3/releases/download/3.15.2/rebar3
        chmod +x /usr/local/bin/rebar3
    - name: Check rebar3 Version
      run: rebar3 --version
    # Static checks run on every OTP in the range. Tests + coverage need PropEr
    # 1.5 (OTP floor 21.3) and run common_test, so they're gated to OTP >= 21.
    # `make coverage` runs eunit + ct + proper and asserts 100% on the production
    # module via scripts/check_coverage.escript.
    - name: Compile
      run: make compile
    - name: Xref
      run: make xref
    - name: Dialyzer
      run: make dialyzer
    - name: Tests + coverage
      if: matrix.otp_version >= 21
      run: make coverage

  newer-builds:
    name: Erlang ${{ matrix.otp_version }} build
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        otp_version: [24, 25, 26, 27]

    steps:
    - uses: actions/checkout@v6
    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp_version }}
        rebar3-version: ${{ matrix.otp_version >= 26 && '3.25' || '3.22' }}
    - name: Check rebar3 Version
      run: rebar3 --version
    - name: Compile
      run: make compile
    - name: Xref
      run: make xref
    - name: Dialyzer
      run: make dialyzer
    - name: Tests + coverage
      run: make coverage

  lint:
    name: Format & lint
    runs-on: ubuntu-22.04
    # erlfmt and rebar3_lint live in the `dev` rebar3 profile and need a modern
    # OTP, so the style gate runs once here rather than across the matrix.
    steps:
    - uses: actions/checkout@v6
    - uses: erlef/setup-beam@v1
      with:
        otp-version: '27'
        rebar3-version: '3.25'
    - name: Check rebar3 Version
      run: rebar3 --version
    - name: Format check
      run: make format-check
    - name: Lint (elvis)
      run: make lint
